name: Build Windows Portable Exe

on:
  workflow_dispatch:        # 手动触发：Actions 页点 "Run workflow"
  push:
    tags: ['v*']            # 打 tag v0.1.0 等自动触发并发布 Release

permissions:
  contents: write           # 创建 GitHub Release 需要写权限

jobs:
  build-windows:
    runs-on: windows-latest   # Windows Server 2022（兼容 Win10/11）
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Fetch pet animation assets (51 webm)
        run: npm run fetch:assets

      # 产出免安装的裸 exe（素材已内嵌进二进制，双击直接运行）
      - name: Build portable exe (no installers)
        uses: tauri-apps/tauri-action@v0
        with:
          args: --no-bundle    # 只编译 exe，不打 NSIS/MSI 安装包
          # 不传 tagName → tauri-action 只构建不建 release；release 由下方 gh release 步骤处理

      - name: Package portable zip
        shell: bash
        run: |
          cd src-tauri/target/release
          cp big-fat-fish-pet.exe "big-fat-fish-pet_win_portable.exe"
          # 附带说明
          cat > 使用说明.txt <<'EOF'
          蓝色大肥鱼 · 桌面宠物（Windows 免安装版）

          使用方法：双击 big-fat-fish-pet_win_portable.exe 即可运行，
          无需安装，素材已内嵌在 exe 内。

          交互：点击有回应、按住拖拽移动、右键菜单可退出/重置位置。
          支持 Win10 / Win11（需系统自带 WebView2，一般已预装）。

          致谢：本项目复刻自 https://github.com/PC2005-cloud/dsh-pet
          的交互逻辑与动画素材，版权归原作者所有，仅限个人使用。
          EOF
          powershell -Command "Compress-Archive -Path 'big-fat-fish-pet_win_portable.exe','使用说明.txt' -DestinationPath 'big-fat-fish-pet_win_portable.zip' -Force"
          ls -la big-fat-fish-pet_win_portable.*

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: big-fat-fish-pet-win-portable-exe
          path: src-tauri/target/release/big-fat-fish-pet_win_portable.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: big-fat-fish-pet-win-portable-zip
          path: src-tauri/target/release/big-fat-fish-pet_win_portable.zip
          if-no-files-found: error

      # tag 触发（v*）时创建 GitHub Release 并附加 exe + zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd src-tauri/target/release
          cat > /tmp/release_notes.md <<'NOTES'
          蓝色大肥鱼 · 桌面宠物（Windows 免安装便携版）

          本包包含：
          * big-fat-fish-pet_win_portable.exe — 单文件便携版，双击直接运行
          * big-fat-fish-pet_win_portable.zip — exe + 使用说明

          支持 Win10 / Win11（需系统自带 WebView2）。

          致谢：复刻自 https://github.com/PC2005-cloud/dsh-pet 的交互逻辑与动画素材，
          版权归原作者所有，仅限个人使用。
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            big-fat-fish-pet_win_portable.exe \
            big-fat-fish-pet_win_portable.zip \
            --title "big-fat-fish-pet $GITHUB_REF_NAME" \
            --notes-file /tmp/release_notes.md \
            --draft
