name: Build Windows Installers

on:
  workflow_dispatch:        # 手动触发：Actions 页点 "Run workflow"
  push:
    tags: ['v*']            # 打 tag v0.1.0 等自动触发并发布 Release

jobs:
  build-windows:
    runs-on: windows-latest   # Windows Server 2022（兼容 Win10/11）
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Fetch pet animation assets (51 webm)
        run: npm run fetch:assets

      - name: Build frontend (vite)
        run: npm run build

      - name: Build & bundle installers (NSIS exe + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}   # 仅 tag 触发时有值
          releaseName: 'big-fat-fish-pet ${{ github.ref_name }}'
          releaseBody: '蓝色大肥鱼桌面宠物 Windows 安装包'
          releaseDraft: true
          prerelease: false

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-fat-fish-pet-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-fat-fish-pet-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
